name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches VERSION
        run: |
          PKG_VERSION=$(python -c "import re,pathlib;print(re.search(r\"VERSION = '([^']+)'\", pathlib.Path('skills/qoder-task-manager/scripts/build_pkg.py').read_text()).group(1))")
          SKILL_VERSION=$(python -c "import re,pathlib;print(re.search(r'^version:\s*(\S+)', pathlib.Path('skills/qoder-task-manager/SKILL.md').read_text(), re.M).group(1))")
          TAG_VERSION="${{ steps.ref.outputs.version }}"
          echo "tag=$TAG_VERSION build_pkg=$PKG_VERSION SKILL.md=$SKILL_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$SKILL_VERSION" ]; then
            echo "::error::版本号不一致：先在 SKILL.md 与 build_pkg.py 里同步到 $TAG_VERSION 再打 tag"
            exit 1
          fi

      - name: Doctor (sanity check script imports)
        run: python skills/qoder-task-manager/scripts/qoder_sessions.py --version

      - name: Build packages
        run: python skills/qoder-task-manager/scripts/build_pkg.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  # 放在同一个 workflow 里，而不是另建 release-triggered workflow：
  # 用 GITHUB_TOKEN 创建的 Release 不会再触发其它 workflow（GitHub 防递归）。
  skillhub:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SkillHub CLI
        run: |
          curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --cli-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Login
        env:
          SKILLHUB_KEY: ${{ secrets.SKILLHUB_KEY }}
        run: |
          if [ -z "$SKILLHUB_KEY" ]; then
            echo "::error::缺少 SKILLHUB_KEY，请先在仓库 Settings → Secrets 里配置"
            exit 1
          fi
          skillhub login --key "$SKILLHUB_KEY" --host https://api.skillhub.cn
          skillhub auth whoami

      - name: Publish to SkillHub
        env:
          CHANGELOG: ${{ github.event.release.name }}
        run: |
          if [ -z "$CHANGELOG" ]; then CHANGELOG="发布 $(git describe --tags --always)"; fi
          # assets/ 只是仓库与 README 的展示图，不属于技能内容；
          # SkillHub 不接受 png 等二进制文件，直接打包会被拒。
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -r skills/qoder-task-manager /tmp/pub/
          rm -rf /tmp/pub/qoder-task-manager/assets
          echo "打包内容："
          find /tmp/pub/qoder-task-manager -type f | sed 's|/tmp/pub/||' | sort

          # SkillHub 偶发 524（网关超时）但服务端其实已处理完，重试会报「版本已存在」。
          # 把这两种情况都当作成功，避免红叉误导。
          for attempt in 1 2 3; do
            set +e
            OUT=$(skillhub publish /tmp/pub/qoder-task-manager \
                    --host https://api.skillhub.cn \
                    --changelog "$CHANGELOG" 2>&1)
            CODE=$?
            set -e
            echo "$OUT"
            if [ $CODE -eq 0 ]; then
              exit 0
            fi
            if echo "$OUT" | grep -qE "已存在|already exists"; then
              echo "::notice::该版本此前已发布成功，视为通过"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "::warning::第 $attempt 次失败，15 秒后重试"
              sleep 15
            fi
          done
          echo "::error::连续 3 次发布失败，请查看上方日志"
          exit 1

